note: MedDRA is licensed by annual MSSO subscription, and the rates are published in full - unusual for a standards
  body. Regulatory authorities, non-profits, educational institutions and direct patient-care providers pay nothing;
  commercial organisations pay on a sliding scale set against the parent company's total consolidated revenue and
  approved annually by the ICH MedDRA Steering Committee. The subscription is the licence to MedDRA itself - the APIs
  are an access route to the terminology a subscription already grants, not a separately metered product, and no per-call
  or per-seat API pricing is published. Organisations headquartered in Japan subscribe through the JMO instead. Rates
  below are verbatim as of 2026-09-17 and exclude consumption taxes, withheld taxes and customs charges.
