  note: The MedDRA API has NO mutating surface. All sixteen operations read the dictionary; the ten POST operations
    post a query body and return results. There is nothing to replay-protect, so idempotency is not applicable rather
    than absent - no Idempotency-Key header is documented and none is needed. Repeating any request returns the same
    data for the same dictionary version, which is the natural consequence of the surface being read-only.
