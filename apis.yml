description: >-
  MedDRA (Medical Dictionary for Regulatory Activities) is the clinically validated international medical
  terminology developed under the auspices of the International Council for Harmonisation (ICH) and used by
  regulatory authorities and the regulated biopharmaceutical industry for adverse event coding, drug safety
  reporting and pharmacovigilance. It is maintained by the MedDRA Maintenance and Support Services
  Organization (MSSO), which publishes a new version twice a year in English and more than a dozen
  translations. The MSSO operates a REST API programme so subscribers can embed MedDRA term search,
  hierarchy navigation (SOC, HLGT, HLT, PT, LLT), SMQ analysis, version-impact reporting and subscription
  validation in their own pharmacovigilance and clinical systems. Two API environments are operated: a
  GxP-assessed one carrying four APIs for validated systems, and a wider non-GxP environment carrying
  sixteen. Access requires an MSSO subscription.
tags:
  - Medical Terminology
  - Pharmacovigilance
  - Drug Safety
  - Adverse Events
