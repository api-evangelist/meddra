apis:
  - aid: meddra:meddra-api
    name: MedDRA API
    description: >-
      The MedDRA API published by the MSSO — term and SMQ search, term/SMQ detail, hierarchy navigation and
      analysis, parent/child type lookup, term history, SMQ analysis, data-file download, search export,
      language and release listings, version and data-impact reports, subscription validation, and an
      unauthenticated status check. Sixteen operations in the non-GxP "Production" (formerly Sandbox)
      environment; four of them (Details, Search, Status, Type) are also offered in the GxP-assessed
      environment. Every operation but Status requires an OAuth 2.0 bearer token issued by the MedDRA
      identity provider against a MedDRA subscription.
