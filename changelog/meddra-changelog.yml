note: MedDRA does not publish an API changelog. What it publishes is a DICTIONARY release cadence - a new MedDRA version
  every March and September, English first and the translations a fortnight later - announced as dated news items
  and accompanied by a "What's New with MedDRA Version X" document. Because every API operation is parameterised by
  MedDRA version and language, the dictionary release IS the thing a consumer has to track; the API contract itself
  carries info.version "1" and has not been versioned in the published spec. Entries below are read verbatim from
  the MSSO news feed.
