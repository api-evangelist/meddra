note: 'Derived from every 4xx/5xx response declared in the harvested MedDRA API OpenAPI. The contract does NOT use
  RFC 9457 application/problem+json - the error responses carry a description and no response body schema at all,
  so an agent gets a status code and a human-readable string and nothing machine-readable to branch on. The spec distinguishes
  several failure MEANINGS inside a single 400 by declaring them as separate response keys ("400 v1" ... "400 v6"),
  which is a Swashbuckle/ASP.NET convention rather than an OpenAPI one: a client cannot tell them apart from the wire
  response. The 429 description is the only one that tells a caller what to do, and it points at throttling documentation
  that lives behind the subscriber login.'
