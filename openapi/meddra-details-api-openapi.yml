      additionalProperties: false
      description: Response Type for SMQ
    synDTO:
      type: object
      properties:
        lltcode:
          type: integer
          description: Parent LLT Code.
          format: int32
        code:
          type: integer
          description: Synonym Code.
          format: int32
        name:
          type:
          - string
          - 'null'
