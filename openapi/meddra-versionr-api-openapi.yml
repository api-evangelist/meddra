openapi: 3.2.0
info:
  title: MedDRA API EUS SBX Version R API
  description: Web API to access MedDRA Data
  contact:
    name: Web Admin
    url: http://www.meddra.org/
    email: wadmin@meddra.org
  version: '1'
security:
- oauth2:
  - meddraapi
tags:
- name: VersionR
paths:
  /api/vr:
    post:
      tags:
      - VersionR
      summary: Returns Data Impacted between Versions
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/verrptDTO'
          application/json:
            schema:
              $ref: '#/components/schemas/verrptDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/verrptDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/verrptDTO'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vrptrDTO'
        200 type=1 lang=Japanese:
          description: jvrptrDTO
        200 type=10 lang=Japanese:
          description: jvrptrDTO
        200 type=1:
          description: vrptrDTO
        200 type=10:
          description: vrptrDTO
        400 v1:
          description: Failed Model Validation
        400 v2:
          description: Language/Version Does Not exist
        400 v3:
          description: Insufficient Authorization
        400 v4:
          description: Invalid Input
        400 v5:
          description: Internal Server Exception
        '401':
          description: Unauthorized Access
        '429':
          description: The throttling limit on this API has been exceeded.  Please review the MedDRA API documentation on throttling limits.
        '500':
          description: Internal Server Error
      operationId: postApiVr
      x-operation-id-source: derived
components:
  schemas:
    verrptDTO:
      required:
      - dlang
      - ever
      - lang
      - ssoc
      - sver
      - vtype
      type: object
      properties:
        lang:
          type: string
          description: '[Required]

            Language.'
          default: English
        dlang:
          type: string
          description: '[Required]

            Display Language.'
          default: English
        vtype:
          type: integer
          description: "[Required]\nVersion Report return type. \nOption 1. \nFuture Use."
          format: int32
        sver:
          type: number
          description: '[Required]

            Starting Version to use.

            Refer to Release API for valid Language/Version Combinations.'
          format: double
        ever:
          type: number
          description: '[Required]

            Ending Version to use.

            Refer to Release API for valid Language/Version Combinations.'
          format: double
        filters:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: Filter results to Specific SOC codes
        ssoc:
          type: boolean
          description: Include Secondary SOC Information True/False
      additionalProperties: false
      description: Input to retrieve Version Report
    mcsDTO:
      type: object
      properties:
        scode:
          type:
          - string
          - 'null'
          description: Start Version Term Code.
        sname:
          type:
          - string
          - 'null'
          description: Start Version Term Name.
        slevel:
          type:
          - string
          - 'null'
          description: Start Version Term Level.
        ecode:
          type:
          - string
          - 'null'
          description: End Version Term Code.
        ename:
          type:
          - string
          - 'null'
          description: End Version Term Name.
        elevel:
          type:
          - string
          - 'null'
          description: End Version Term Level.
      additionalProperties: false
      description: 'MedDRA Code Switches.

        Total Changes between selected versions.'
    promoDTO:
