note: Entity graph derived from the $ref links between the 200+ DTO schemas in the harvested MedDRA API OpenAPI. The
  domain itself is the MedDRA hierarchy - System Organ Class (SOC) -> High Level Group Term (HLGT) -> High Level Term
  (HLT) -> Preferred Term (PT) -> Lowest Level Term (LLT), crossed by Standardised MedDRA Queries (SMQ), and every
  entity is addressed by an 8-digit MedDRA code within a named dictionary version and language. The schema names are
  the provider's own abbreviations (llt, pt, smq, hier, hist, di, vr); they are reproduced as published rather than
  renamed.
core_concepts:
- name: SOC
  description: System Organ Class - the top level of the MedDRA hierarchy.
- name: HLGT
  description: High Level Group Term.
- name: HLT
  description: High Level Term.
- name: PT
  description: Preferred Term - the level at which adverse events are normally reported.
- name: LLT
  description: Lowest Level Term - the level at which verbatim text is coded; carries a currency flag.
- name: SMQ
  description: Standardised MedDRA Query - a curated grouping of terms for safety analysis, with narrow and broad
    scopes.
- name: Version
  description: A MedDRA dictionary release (currently 29.1). Selected per request; history is addressable.
- name: Language
  description: A MedDRA translation. Selected per request; GET /api/lang lists them.
identifiers:
  term_code: 8-digit numeric MedDRA code
  scoped_by:
  - version
  - language
