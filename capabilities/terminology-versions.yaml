naftiko: 1.0.0-alpha2
info:
  label: MedDRA Medical Dictionary for Regulatory Activities API — Versions
  description: 'MedDRA Medical Dictionary for Regulatory Activities API — Versions. 1 operations. Lead operation: List available
    MedDRA versions. Self-contained Naftiko capability covering one Meddra business surface.'
  tags:
  - Meddra
  - Versions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MEDDRA_API_KEY: MEDDRA_API_KEY
capability:
  consumes:
  - type: http
    namespace: terminology-versions
    baseUri: https://api.meddra.example.com/v1
    description: MedDRA Medical Dictionary for Regulatory Activities API — Versions business capability. Self-contained, no
      shared references.
    resources:
    - name: versions
      path: /versions
      operations:
      - name: listversions
        method: GET
        description: List available MedDRA versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MEDDRA_API_KEY}}'
  exposes:
  - type: rest
    namespace: terminology-versions-rest
    port: 8080
    description: REST adapter for MedDRA Medical Dictionary for Regulatory Activities API — Versions. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/versions
      name: versions
      description: REST surface for versions.
      operations:
      - method: GET
        name: listversions
        description: List available MedDRA versions
        call: terminology-versions.listversions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: terminology-versions-mcp
    port: 9090
    transport: http
    description: MCP adapter for MedDRA Medical Dictionary for Regulatory Activities API — Versions. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: list-available-meddra-versions
      description: List available MedDRA versions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: terminology-versions.listversions
      outputParameters:
      - type: object
        mapping: $.
